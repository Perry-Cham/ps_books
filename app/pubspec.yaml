  flutter_staggered_grid_view: ^0.7.0
  http: ^1.6.0
  go_router: ^17.1.0
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  drift_flutter: ^0.3.0
  pdfrx: ^2.4.0
  katbook_epub_reader:
    path: ../packages/katbook_epub_reader
 # dart_pdf_reader: ^2.2.0
  dart_pdf_reader:
    path: ../packages/dart_pdf_reader
  epub_pro:
    path: ../packages/epub_pro
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.3.1
  html: ^0.15.6
  dio: ^5.9.2
  #microsoft_viewer: ^0.0.8
  microsoft_viewer:
      path: ../packages/microsoft_viewer
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^16.0.0
  crypto: ^3.0.7
  oauth2_client: ^4.3.2
  oauth2: ^2.0.5

  path: any
  googleapis_auth: any
  dart_pdf_engine: ^1.3.0
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.0.0
  intl: ^0.20.2
  timezone: ^0.11.0
  image: ^4.8.0
  flutter_launcher_icons: ^0.14.4
  xml: ^6.6.1
 # kindle_unpack: ^0.1.1
  kindle_unpack:
    path: ../packages/kindle_unpack
  flutter_charset_detector: any
  charset_converter: any
  scrollable_positioned_list: ^0.3.8
  # comic_reader: ^0.4.0
  comic_reader:
    path: ../packages/comic_reader
  shelf: ^1.4.2
  audioplayers: ^6.0.0
  internet_connection_checker_plus: ^3.0.1
  webview_all:
    path: ../packages/webview_all
 # webview_all: ^1.1.3
  shelf_router: ^1.1.4
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  pdf_renderer_bridge: ^0.0.3
